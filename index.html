<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HP Brutal</title>
    <header>@EdwardNst</header>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        .hud-panel {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 4px 30px rgba(255, 0, 0, 0.2);
            width: 95%;
            max-width: 450px;
        }

        .fps-counter {
            font-size: 3rem;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
        }

        .stats-info {
            font-size: 1.2rem;
            color: #ffcccc;
            text-align: center;
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-normal {
            background-color: #f39c12;
            color: white;
        }

        .btn-nuke {
            background-color: #c0392b;
            color: white;
            box-shadow: 0 0 15px rgba(192, 57, 43, 0.8);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        .btn-stop {
            background-color: #27ae60;
            color: white;
        }

        
        .shake {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

       
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div id="fps" class="fps-counter">0 FPS</div>
        <div class="stats-info">
            Partikel: <span id="particle-count">0</span>
        </div>
        <div class="controls">
            <button class="btn-normal" onclick="startTest('normal')">Test Brutal</button>
            <button class="btn-nuke" onclick="startTest('nuke')">Test Paling Brutal</button>
            <button class="btn-stop" onclick="stopTest()">Hentikan Test</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');
        const countDisplay = document.getElementById('particle-count');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;

        let testMode = 'none'; 
        let particles = [];
        let memoryLeak = []; 

        
        let audioCtx;
        let oscillator;
        let gainNode;

        function startBuzzer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (oscillator) return; 

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

          
            oscillator.type = 'sawtooth';
            
            oscillator.frequency.setValueAtTime(65, audioCtx.currentTime);

           
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(20, audioCtx.currentTime); 
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(15, audioCtx.currentTime); 
            
            lfo.connect(lfoGain);
            lfoGain.connect(oscillator.frequency);
            lfo.start();

            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopBuzzer() {
            if (oscillator) {
                oscillator.stop();
                oscillator.disconnect();
                oscillator = null;
            }
        }

        function updateFPS() {
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsDisplay.textContent = fps + ' FPS';

                if (fps > 45) {
                    fpsDisplay.style.color = '#00ff66';
                    fpsDisplay.style.textShadow = '0 0 15px rgba(0,255,102,0.7)';
                } else if (fps > 15) {
                    fpsDisplay.style.color = '#f39c12';
                    fpsDisplay.style.textShadow = '0 0 15px rgba(243,156,18,0.7)';
                } else {
                    fpsDisplay.style.color = '#ff0000';
                    fpsDisplay.style.textShadow = '0 0 20px rgba(255,0,0,1)';
                }

                frameCount = 0;
                lastTime = now;
            }
        }

        class DeathParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.radius = Math.random() * 30;
                this.color = `rgba(${Math.random()*255}, ${Math.random()*100}, 0, 0.9)`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                
                let heavyMath = 0;
                for (let i = 0; i < 200; i++) {
                    heavyMath += Math.sqrt(Math.abs(Math.sin(this.x) * Math.cos(this.y) * Math.log(this.radius + i)));
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 30; 
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function startTest(mode) {
            testMode = mode;
            startBuzzer();
            document.body.classList.add('shake'); 

            if (mode === 'normal') {
                for (let i = 0; i < 15000; i++) {
                    particles.push(new DeathParticle());
                }
                countDisplay.textContent = particles.length;
            }
        }

        function stopTest() {
            testMode = 'none';
            particles = [];
            memoryLeak = [];
            countDisplay.textContent = 0;
            ctx.clearRect(0, 0, width, height);
            
            fpsDisplay.style.color = '#00ff66';
            fpsDisplay.textContent = 'STOP';
            
            stopBuzzer();
            document.body.classList.remove('shake'); 
        }

        function loop() {
            updateFPS();

            if (testMode !== 'none') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, width, height);

                if (testMode === 'nuke') {
                    (3000 per frame)
                    for (let i = 0; i < 3000; i++) {
                        particles.push(new DeathParticle());
                    }
                    
                    
                    memoryLeak.push(new Array(1024 * 1024 * 2).join('☠️'));
                    
                    countDisplay.textContent = particles.length;
                }

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                }
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        loop();
    </script>
</body>
</html>
