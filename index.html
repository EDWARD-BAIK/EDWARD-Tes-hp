<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test hp</title>
    <header>@EdwardNst</header>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        
        .hud-panel {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 4px 30px rgba(255, 0, 0, 0.2);
            width: 95%;
            max-width: 450px;
        }

        .fps-counter {
            font-size: 3rem;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
        }

        .stats-info {
            font-size: 1rem;
            color: #ffcccc;
            text-align: center;
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-normal {
            background-color: #f39c12;
            color: white;
        }

        .btn-nuke {
            background-color: #c0392b;
            color: white;
            box-shadow: 0 0 15px rgba(192, 57, 43, 0.8);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        .btn-stop {
            background-color: #27ae60;
            color: white;
        }

        /* Canvas Area */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div id="fps" class="fps-counter">0 FPS</div>
        <div class="stats-info">
            Partikel: <span id="particle-count">0</span> | RAM Bloat: <span id="ram-count">0</span> MB
        </div>
        <div class="controls">
            <button class="btn-normal" onclick="startTest('normal')">Test brutal</button>
            <button class="btn-nuke" onclick="startTest('nuke')">test biasa</button>
            <button class="btn-stop" onclick="stopTest()">Hentikan Test</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');
        const countDisplay = document.getElementById('particle-count');
        const ramDisplay = document.getElementById('ram-count');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;

        
        let testMode = 'none'; // 'none', 'normal', 'nuke'
        let particles = [];
        let memoryLeak = []; 
        let mbCount = 0;

        function updateFPS() {
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsDisplay.textContent = fps + ' FPS';

                if (fps > 45) {
                    fpsDisplay.style.color = '#00ff66';
                    fpsDisplay.style.textShadow = '0 0 15px rgba(0,255,102,0.7)';
                } else if (fps > 15) {
                    fpsDisplay.style.color = '#f39c12';
                    fpsDisplay.style.textShadow = '0 0 15px rgba(243,156,18,0.7)';
                } else {
                    fpsDisplay.style.color = '#ff0000';
                    fpsDisplay.style.textShadow = '0 0 20px rgba(255,0,0,1)';
                }

                frameCount = 0;
                lastTime = now;
            }
        }

        class DeathParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.radius = Math.random() * 20;
                this.color = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.8)`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                
                let heavyMath = 0;
                for (let i = 0; i < 50; i++) {
                    heavyMath += Math.sqrt(Math.abs(Math.sin(this.x) * Math.cos(this.y) * Math.log(this.radius + i)));
                }

                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20; 
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function startTest(mode) {
            testMode = mode;
            if (mode === 'normal') {
                for (let i = 0; i < 10000; i++) {
                    particles.push(new DeathParticle());
                }
                countDisplay.textContent = particles.length;
            }
        }

        function stopTest() {
            testMode = 'none';
            particles = [];
            memoryLeak = [];
            mbCount = 0;
            countDisplay.textContent = 0;
            ramDisplay.textContent = 0;
            ctx.clearRect(0, 0, width, height);
            fpsDisplay.style.color = '#00ff66';
            fpsDisplay.textContent = 'STOP';
        }

        
        function loop() {
            updateFPS();

            if (testMode !== 'none') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, width, height);

                
                if (testMode === 'nuke') {
                    
                    for (let i = 0; i < 500; i++) {
                        particles.push(new DeathParticle());
                    }
                    
                    memoryLeak.push(new Array(1024 * 1024).join('☠️'));
                    mbCount++;
                    
                    countDisplay.textContent = particles.length;
                    ramDisplay.textContent = mbCount; // Menampilkan perkiraan MB yang dimakan
                }

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                }
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
