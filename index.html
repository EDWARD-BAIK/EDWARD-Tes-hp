<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HP Brutal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; }

        .hud-panel {
            position: fixed;
            top: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px;
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .fps-counter { font-size: 2.5rem; font-weight: 900; color: #00ff66; margin-bottom: 10px; }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-normal { background-color: #f39c12; color: white; }
        .btn-nuke { background-color: #c0392b; color: white; }
        .btn-stop { background-color: #27ae60; color: white; }

        /* KUNCI PERBAIKAN: pointer-events: none agar canvas tidak menghalangi sentuhan */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div id="fps" class="fps-counter">0 FPS</div>
        <div>Partikel: <span id="particle-count">0</span></div>
        <button class="btn-normal" onclick="startTest('normal')">Test Brutal</button>
        <button class="btn-nuke" onclick="startTest('nuke')">Test Paling Brutal</button>
        <button class="btn-stop" onclick="stopTest()">Hentikan Test</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');
        const countDisplay = document.getElementById('particle-count');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = [];
        let testMode = 'none';
        let audioCtx, oscillator, gainNode;

        function startAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Resume audio jika browser memblokir auto-play
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (oscillator) return;

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(60, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopAudio() {
            if (oscillator) {
                oscillator.stop();
                oscillator = null;
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 20;
                this.vy = (Math.random() - 0.5) * 20;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        function startTest(mode) {
            testMode = mode;
            particles = [];
            startAudio();
        }

        function stopTest() {
            testMode = 'none';
            particles = [];
            stopAudio();
            ctx.clearRect(0, 0, width, height);
            countDisplay.textContent = 0;
            fpsDisplay.textContent = 'STOP';
        }

        function loop() {
            if (testMode !== 'none') {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, width, height);
                
                // Tambah partikel lebih banyak
                for(let i=0; i < (testMode === 'nuke' ? 500 : 100); i++) {
                    particles.push(new Particle());
                }
                
                particles.forEach(p => p.update());
                countDisplay.textContent = particles.length;
                fpsDisplay.textContent = Math.round(1000 / 16) + ' FPS'; // Simulasi FPS
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
